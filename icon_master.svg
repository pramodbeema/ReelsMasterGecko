<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Instagram Multi-Stop Sunset Gradient -->
    <linearGradient id="igSunsetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDC80" />
      <stop offset="25%" stop-color="#F77737" />
      <stop offset="50%" stop-color="#E1306C" />
      <stop offset="75%" stop-color="#C13584" />
      <stop offset="100%" stop-color="#833AB4" />
    </linearGradient>

    <!-- Subtle Soft Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Instagram Logo (Bottom-Left) -->
  <g transform="translate(10, 242)">
    <!-- Squircle base -->
    <rect x="0" y="0" width="260" height="260" rx="60" fill="url(#igSunsetGrad)" />
    <!-- Outer camera rounded outline -->
    <rect x="44" y="44" width="172" height="172" rx="49" fill="none" stroke="#FFFFFF" stroke-width="21" />
    <!-- Center lens circle -->
    <circle cx="130" cy="130" r="54" fill="none" stroke="#FFFFFF" stroke-width="21" />
    <!-- Flash dot -->
    <circle cx="190" cy="70" r="13" fill="#FFFFFF" />
  </g>

  <!-- 2. Facebook Logo (Bottom-Right) -->
  <g transform="translate(242, 242)">
    <!-- Royal blue circle base -->
    <circle cx="130" cy="130" r="130" fill="#1877F2" />
    <!-- Official white 'f' -->
    <path d="M120 260 L120 160 L83 160 L83 125 L120 125 L120 96 C120 63 140 45 170 45 C185 45 198 47 198 47 L198 79 L178 79 C162 79 157 89 157 99 L157 125 L196 125 L191 160 L157 160 L157 260 Z" fill="#FFFFFF" />
  </g>

  <!-- 3. YouTube Logo (Top-Center, overlapping with subtle shadow) -->
  <g transform="translate(91, 10)" filter="url(#badgeShadow)">
    <!-- Red rounded pill rectangle -->
    <rect x="0" y="0" width="330" height="230" rx="64" fill="#FF0000" />
    <!-- Solid white play triangle -->
    <polygon points="135,69 135,161 216,115" fill="#FFFFFF" />
  </g>
</svg>
